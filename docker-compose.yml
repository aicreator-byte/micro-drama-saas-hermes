version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: micro-drama-postgres
    environment:
      POSTGRES_USER: drama_user
      POSTGRES_PASSWORD: drama_pass
      POSTGRES_DB: micro_drama_saas
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drama_user -d micro_drama_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: micro-drama-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: micro-drama-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://drama_user:drama_pass@postgres:5432/micro_drama_saas
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: your-super-secret-key-change-in-production
      DEBUG: "true"
      AI_PROVIDER: nvidia
      AI_MODEL: nvidia/nemotron-3-ultra-550b-a55b
      AI_API_KEY: ""
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:8000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./uploads:/home/hatch/workspace/micro-drama-saas/hermes/uploads

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: micro-drama-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: